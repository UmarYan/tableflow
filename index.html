.optionEditor .optionControl.active{background:var(--pri2);color:var(--pri)}
.optionEditor .addItem{width:100%;height:64px;padding:0 18px;border:2px solid #73777c;border-radius:32px;background:var(--card);color:var(--ink);font-size:18px;outline:0}
.optionEditor .addItem:focus{border-color:var(--pri);box-shadow:0 0 0 3px #176b3a18}
.optionEditor .optionList{display:grid;gap:7px;margin-top:18px;max-height:52vh;overflow:auto}
.optionEditor .optionItem{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 12px 0 14px;background:var(--pri2);border-radius:28px;touch-action:none}
.optionEditor .optionItem.dragging{opacity:.55}
.optionEditor .optionName{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px}
.dragDots{width:18px;height:24px;display:grid;grid-template-columns:repeat(2,4px);grid-template-rows:repeat(3,4px);gap:3px;flex:0 0 18px;cursor:grab;touch-action:none}
.dragDots i{width:4px;height:4px;background:var(--ink);border-radius:2px}
.optionMore{width:38px;height:38px;padding:0;border-radius:19px;background:transparent;color:var(--ink);font-size:23px}
.optionMenu{position:fixed;z-index:13000;background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:0 8px 24px #0003;padding:5px;min-width:130px}
.optionMenu button{display:block;width:100%;text-align:left;background:transparent;padding:9px 11px;color:var(--ink)}
.optionMenu button:hover{background:var(--pri2)}
.optionEditor .footer{margin-top:18px}
.optionEditor .footer button{min-width:96px;border-radius:28px;padding:12px 22px}
.modal.optionModal{align-items:center}
.modal.optionModal .sheet{width:min(540px,92vw);max-height:90vh;border-radius:30px;padding:28px 26px}
@media(max-width:520px){.modal.optionModal .sheet{width:calc(100vw - 28px);padding:27px 26px}.optionEditor .optionTitle{font-size:25px}}

/* V1.1.2 fixes: genuine vertical table scrolling, sticky column headers, and fixed group labels */
.tableOpen .scroll{max-height:calc(100dvh - 220px);overflow:auto;overscroll-behavior:contain;position:relative;border-radius:0;box-shadow:none;background:transparent}
.tableOpen .grid{min-width:max-content}
.tableOpen .grid thead th{position:sticky;top:0;z-index:7}
.tableOpen .grid thead th:first-child{left:0;z-index:12}
.tableOpen .grid tbody td.rowActions{left:0;z-index:6}
.tableOpen .rowGroupHeader td{position:sticky;left:0;z-index:10;min-width:0;background:var(--pri2);box-shadow:0 1px 0 var(--line);}
.tableOpen .rowGroupHeader button{position:relative;z-index:2;min-width:40px;min-height:34px;border-radius:18px}
.tableOpen .grid .addRowLine{display:none!important}
.tableBottomBar .barInner{justify-content:space-between;padding:0 8px}
.tableBottomBar .barInner button:first-child{order:0}
.tableBottomBar .barInner button{flex:1}
.dropdownPopup .selectChoice{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:10px 12px;border-radius:10px;text-align:left;background:transparent;color:var(--ink);white-space:normal}
.dropdownPopup .selectChoice .choiceTick{margin-left:auto;color:var(--pri);font-weight:800}
.dropdownPopup .selectChoice.multiSelected{background:var(--pri2)!important}
.dropdownPopup .popupFooter{display:flex;gap:8px;padding-top:8px;margin-top:6px;border-top:1px solid var(--line)}
.dropdownPopup .popupFooter button{flex:1}
@media(max-width:650px){.tableOpen .scroll{max-height:calc(100dvh - 205px)}.tableBottomBar .barInner{padding:0 2px}.tableBottomBar button{min-width:0;padding:4px 3px;font-size:11px}}


/* V1.1.3 usability update */
.tableOpen .scroll{overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable;max-height:calc(100dvh - 205px)}
.tableOpen .grid thead th{position:sticky;top:0;z-index:12}
.tableOpen .grid thead th:first-child{left:0;z-index:16}
.tableOpen .grid .rowGroupHeader td{position:sticky;left:0;z-index:10;background:var(--pri2);color:var(--ink);box-shadow:3px 0 0 var(--line);border-bottom:2px solid var(--line)}
.tableOpen .grid .rowGroupHeader td .groupTitle{display:inline-flex;align-items:center;gap:7px;min-height:34px;white-space:nowrap}
.tableOpen .grid .rowGroupHeader td button{float:right;background:transparent;color:var(--ink);padding:4px 12px}
.grid td{ text-align:inherit } .grid input,.grid select,.grid .dropdownButton{ text-align:inherit }
.blankCellTap{display:block;width:100%;min-width:100%;min-height:28px;height:100%;padding:0;margin:0;border:0;border-radius:0;background:transparent!important;color:transparent!important;box-shadow:none!important}
.dropdownCell{min-height:30px}.dropdownButton.empty{min-height:28px}.imageCell{justify-content:inherit}.imageCell .thumb{cursor:pointer}.amountCellInput{min-height:28px}
.totalDock{margin-top:3.25em;padding-top:0;overflow:auto}
.rowCountChoices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px}.rowCountChoices button{font-size:19px;padding:16px 4px;border-radius:14px}
.tableBottomBar .barInner{justify-content:space-between;padding:0 6px}.tableBottomBar button{flex:1;min-width:0!important;max-width:100px;height:52px;padding:3px!important}.tableBottomBar button .barIcon{font-size:25px;line-height:34px;margin:0}
@media(max-width:650px){.tableOpen .scroll{max-height:calc(100dvh - 205px)}.tableBottomBar .barInner{padding:0 2px}.tableBottomBar button{font-size:11px}}

<body>
<div id="app" class="app"></div><div id="modal" class="modal"><div id="sheet" class="sheet"></div></div><div id="toast" class="toast"></div>
<div id="scrim" class="scrim" onclick="closeMenu()"></div>
<aside id="drawer" class="drawer"><div class="drawerHead"><div><h2>TableFlow</h2><span class="drawerDesc">Simple. Flexible. Yours.</span></div></div>
<h3>Tables</h3><button onclick="closeMenu();renderHome()">▦ All Tables</button><button onclick="closeMenu();folderModal()">📁 Manage folders</button>
<h3>Data</h3><button onclick="closeMenu();backup()">💾 Backup all tables</button><button onclick="closeMenu();restorePick()">♻️ Restore backup</button><button onclick="closeMenu();exportCurrentCSV()">📄 Export current CSV</button>
<h3>Appearance</h3><select id="themeChoice" onchange="setTheme(this.value)"><option value="auto">Theme: Auto</option><option value="light">Theme: Day</option><option value="dark">Theme: Night</option></select>
<h3>Defaults</h3><select id="currencyChoice" onchange="localStorage.setItem('my_tables_currency',this.value)"><option>INR ₹</option><option>USD $</option><option>EUR €</option><option>GBP £</option><option>BDT ৳</option></select><select id="dateChoice" onchange="localStorage.setItem('my_tables_date_format',this.value)"><option>DD/MM/YYYY</option><option>MM/DD/YYYY</option><option>YYYY-MM-DD</option></select>
<h3>App</h3><button onclick="closeMenu();showAbout()">ℹ️ About TableFlow</button><button onclick="location.reload()">↻ Refresh</button></aside>
<script>
'use strict';

window.addEventListener('error',e=>{const a=document.getElementById('app');if(a&&(!a.innerHTML||a.innerHTML.trim()===''))a.innerHTML='<div class="empty"><h3>TableFlow could not start</h3><p>'+esc(e.message||'Unexpected error')+'</p><button class="primary" onclick="localStorage.clear();location.reload()">Reset local app data</button></div>'});
const KEY='my_tables_generic_v3',OLD='my_tables_generic_v2';
const TYPES=[['text','Text'],['date','Date'],['amount','Amount'],['number','Number'],['image','Image'],['formula','Formula'],['select','Dropdown / Select'],['status','Status'],['checkbox','Checkbox'],['time','Time'],['phone','Phone number']];
const $=id=>document.getElementById(id);let editingTable=null,folderFilter='all',selectedRows=new Set(),pendingSearchTarget=null;
function parse(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function normalize(x){if(!x||!Array.isArray(x.tables))return{tables:[],folders:[],active:null};x.folders=Array.isArray(x.folders)?x.folders.map(f=>({id:String(f.id||Date.now()),name:String(f.name||'Folder')})):[];x.tables=x.tables.map((t,i)=>({id:String(t.id||Date.now()+i),name:String(t.name||'Untitled Table'),folderId:t.folderId?String(t.folderId):'',groupBy:t.groupBy?String(t.groupBy):'',filters:t.filters&&typeof t.filters==='object'?t.filters:{},savedFilters:Array.isArray(t.savedFilters)?t.savedFilters.map(f=>({id:String(f.id||Date.now()),name:String(f.name||'Saved filter'),filters:f.filters&&typeof f.filters==='object'?f.filters:{}})):[],search:String(t.search||''),columns:Array.isArray(t.columns)&&t.columns.length?t.columns.map((c,j)=>({id:String(c.id||'c'+j),name:String(c.name||'Column '+(j+1)),type:TYPES.some(q=>q[0]===c.type)?c.type:'text',formula:String(c.formula||''),options:Array.isArray(c.options)?c.options.map(String):[],pinned:!!c.pinned,hidden:!!c.hidden,multi:!!c.multi,width:Number(c.width)||140,widthPct:Number(c.widthPct)||0,align:['left','center','right'].includes(c.align)?c.align:'left'})):[{id:'c1',name:'Name',type:'text',formula:'',options:[]}],rows:Array.isArray(t.rows)?t.rows.map(r=>r&&typeof r==='object'?r:{}):[]}));return{tables:x.tables,folders:x.folders,active:x.active||null}}
let state=normalize(parse(KEY)||parse(OLD)||{tables:[],folders:[],active:null});save();
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function getT(id){return state.tables.find(t=>String(t.id)===String(id))}function getF(id){return state.folders.find(f=>String(f.id)===String(id))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(x){let e=$('toast');e.textContent=x;e.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>e.classList.remove('show'),2000)}
function openMenu(){$('drawer').classList.add('open');$('scrim').classList.add('open')}function closeMenu(){$('drawer').classList.remove('open');$('scrim').classList.remove('open')}function show(x){closeDropdown();$('sheet').innerHTML=x;$('modal').classList.toggle('optionModal',x.includes('optionEditor'));$('modal').classList.add('open');if(x.includes('optionEditor'))setTimeout(bindOptionDrag,30)}function closeModal(){closeDropdown();document.querySelectorAll('.optionMenu').forEach(x=>x.remove());$('modal').classList.remove('open','optionModal');editingTable=null}$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.addEventListener('click',e=>{if(!e.target.closest('.sortMenu')&&!e.target.closest('.headerIcon'))$('sortMenu')?.classList.remove('open')});
function currency(){let v=localStorage.getItem('my_tables_currency')||'INR ₹';return v.split(' ').slice(1).join(' ')||'₹'}
function renderHome(){
  document.body.classList.remove('tableOpen');
  setView('home');state.active=null;save();
  let rows=state.tables.reduce((n,t)=>n+t.rows.length,0),folders=state.folders;
  let mode=localStorage.getItem('tableflow_home_view')||'grid';
  let folderOptions='<option value="all">All Tables</option>'+folders.map(f=>'<option value="'+esc(f.id)+'" '+(folderFilter===f.id?'selected':'')+'>'+esc(f.name)+'</option>').join('');
  $('app').innerHTML='<div class="homeHeader"><button class="menuBtn" onclick="openMenu()">☰</button><select class="folderSelect" onchange="setFolderFilter(this.value)">'+folderOptions+'</select><button class="headerIcon" onclick="openUniversalSearch()" title="Search all tables">⌕</button><button class="headerIcon" onclick="toggleSort()" title="Sort">↕</button><button class="headerIcon" onclick="toggleHomeView()" title="Grid / List">'+(mode==='grid'?'☷':'▦')+'</button></div><div id="sortMenu" class="sortMenu"><button onclick="sortTables(\'nameAsc\')">Name A → Z</button><button onclick="sortTables(\'nameDesc\')">Name Z → A</button><button onclick="sortTables(\'rowsDesc\')">Most rows</button><button onclick="sortTables(\'columnsDesc\')">Most columns</button></div><div class="section" style="margin-top:4px"><h2>All Tables</h2><span class="muted">'+state.tables.length+' tables · '+rows+' rows</span></div><div class="tables '+(mode==='list'?'listView':'gridView')+'" id="tableList">'+cards(filteredTables())+'</div><button class="fab" onclick="newTable()" title="New table">＋</button>';
}
function toggleHomeView(){let m=localStorage.getItem('tableflow_home_view')||'grid';localStorage.setItem('tableflow_home_view',m==='grid'?'list':'grid');renderHome()}
function openUniversalSearch(){show('<div class="modalTop"><h2>Search all tables</h2><button onclick="closeModal()">✕</button></div><input id="universalSearchInput" class="search" style="margin-bottom:10px" placeholder="Search table names and cell contents..." oninput="runUniversalSearch(this.value)"><div id="universalResults"><p class="muted">Type to search across all tables.</p></div>');setTimeout(()=>{$('universalSearchInput')?.focus()},60)}
function openSearchResult(id,rowIndex,q){let t=getT(id);if(!t)return;if(q){t.search=q}pendingSearchTarget=rowIndex!=null?{row:rowIndex,q:q}:null;save();closeModal();openTable(id)}
function runUniversalSearch(q){q=String(q||'').trim().toLowerCase();let box=$('universalResults');if(!box)return;if(!q){box.innerHTML='<p class="muted">Type to search across all tables.</p>';return}let out=[];state.tables.forEach(t=>{let nameHit=t.name.toLowerCase().includes(q);if(nameHit)out.push('<button class="universalResult" onclick="closeModal();openSearchResult(\''+esc(t.id)+'\',null,\''+esc(q)+'\')"><b>'+esc(t.name)+'</b><small>Table name</small></button>');t.rows.forEach((r,i)=>{let hit=t.columns.some(c=>String(r[c.id]??'').toLowerCase().includes(q));if(hit&&out.length<60){let bits=t.columns.map(c=>{let v=String(r[c.id]??'').trim();return v&&v.toLowerCase().includes(q)?esc(c.name)+': '+esc(v):''}).filter(Boolean).slice(0,2);out.push('<button class="universalResult" onclick="closeModal();openSearchResult(\''+esc(t.id)+'\','+i+',\''+esc(q)+'\')"><b>'+esc(t.name)+' · Row '+(i+1)+'</b><small>'+bits.join(' · ')+'</small></button>')}})});box.innerHTML=out.length?out.join(''):'<p class="muted">No matches found.</p>'}
function filteredTables(){return folderFilter==='all'?state.tables:state.tables.filter(t=>t.folderId===folderFilter)}
function setFolderFilter(id){folderFilter=id;renderHome()}
function toggleSearch(){let e=$('headerSearch'),b=$('searchBtn');e.classList.toggle('open');b.classList.toggle('active');if(e.classList.contains('open'))setTimeout(()=>$('quickSearch')?.focus(),50);else{if($('quickSearch'))$('quickSearch').value='';filterTables('')}}
function toggleSort(){$('sortMenu').classList.toggle('open')}
function openHomeMenu(){openMenu()}
function sortTables(mode){let a=filteredTables().slice();let cmp=(x,y)=>mode==='nameAsc'?x.name.localeCompare(y.name):mode==='nameDesc'?y.name.localeCompare(x.name):mode==='rowsDesc'?y.rows.length-x.rows.length:y.columns.length-x.columns.length;a.sort(cmp);if(folderFilter==='all'){state.tables=a}else{let ids=new Set(a.map(x=>x.id)),pos=new Map(a.map((x,i)=>[x.id,i]));let sorted=state.tables.filter(x=>ids.has(x.id)).sort((x,y)=>pos.get(x.id)-pos.get(y.id));let k=0;state.tables=state.tables.map(x=>ids.has(x.id)?sorted[k++]:x)}save();$('sortMenu')?.classList.remove('open');renderHome();toast('Sorted')}
function cards(a){return a.length?a.map(t=>'<div class="tableCard" data-name="'+esc(t.name.toLowerCase())+'" onclick="openTable(\''+esc(t.id)+'\')"><div class="tc"><div class="grow"><h3>'+esc(t.name)+'</h3><span class="muted">'+t.columns.length+' columns · '+t.rows.length+' rows'+(getF(t.folderId)?' · '+esc(getF(t.folderId).name):'')+'</span></div></div></div>').join(''):'<div class="empty" style="grid-column:1/-1"><h3>No tables here</h3><p>Create a table or move an existing table into this folder.</p></div>'}
function filterTables(q){document.querySelectorAll('.tableCard').forEach(x=>x.style.display=x.dataset.name.includes(q.toLowerCase())?'':'none')}
function newTable(){let id='t'+Date.now();show('<div class="modalTop"><h2>New table</h2><button onclick="closeModal()">✕</button></div><div class="field"><label>Table name</label><input id="newTableName" value="New Table" autofocus></div><div class="field"><label>Folder</label><select id="newTableFolder"><option value="">No folder</option>'+state.folders.map(f=>'<option value="'+esc(f.id)+'">📁 '+esc(f.name)+'</option>').join('')+'</select></div><div class="footer"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="createTable()">Create table</button></div>');setTimeout(()=>{$('newTableName')?.focus();$('newTableName')?.select()},50)}
function createTable(){let n=$('newTableName')?.value.trim();if(!n)return;let t={id:'t'+Date.now(),name:n,folderId:$('newTableFolder')?.value||'',filters:{},savedFilters:[],columns:[{id:'c1',name:'Name',type:'text',formula:'',options:[],pinned:false,hidden:false,width:140}],rows:[]};state.tables.push(t);save();closeModal();toast('Table created');openTable(t.id)}
function renderTable(t){
  document.body.classList.add('tableOpen');
  state.active=t.id;
  let amountCols=t.columns.filter(c=>c.type==='amount');
  let groupColId=t.groupBy||'';
  let groupCol=groupColId?t.columns.find(c=>c.id===groupColId):null;
  let rows=visibleRows(t);
  let rowsHtml=groupCol?renderGroupedRows(t,groupCol,rows):rows.map(x=>renderRow(t,x.r,x.i)).join('');
  let activeFilterCount=Object.keys(t.filters||{}).length;
  let visibleCols=t.columns.filter(c=>!c.hidden);
  let headers='<th><button class="selectAllNo '+(selectedRows.size&&rows.length&&rows.every(x=>selectedRows.has(x.i))?'active':'')+'" onclick="toggleSelectAllVisible()" title="Select all visible rows">#</button></th>'+visibleCols.map((c,i)=>'<th class="'+(c.pinned?'pinnedCell':'')+'" style="width:'+colWidth(c)+'px;min-width:'+colWidth(c)+'px;text-align:'+(c.align||'left')+';'+(c.pinned?'left:'+pinnedLeft(t,i)+'px;':'')+'" onclick="columnMenu(\''+esc(c.id)+'\')" data-col-id="'+esc(c.id)+'">'+esc(c.name)+(c.pinned?' 📌':'')+(t.filters&&t.filters[c.id]?' <span class="filterBadge">●</span>':'')+'</th>').join('');
  let totalCells='<div class="totalDockInner"><div class="totalCell no">Σ</div>'+visibleCols.map((c,i)=>c.type==='amount'?'<div class="totalCell amount '+(c.pinned?'pinned':'')+'" style="width:'+colWidth(c)+'px;min-width:'+colWidth(c)+'px;'+(c.pinned?'left:'+pinnedLeft(t,i)+'px;':'')+'">'+currency()+' '+formatNum(totalAmountVisible(t,c))+'</div>':(i===0?'<div class="totalCell label">Total</div>':'<div class="totalCell" style="width:'+colWidth(c)+'px;min-width:'+colWidth(c)+'px;"></div>')).join('')+'</div>';
  $('app').innerHTML='<div class="workspace"><button class="menuBtn" onclick="backToHome()" title="Back">←</button><h1 style="flex:1">'+esc(t.name)+'</h1><button class="headerIcon" onclick="toggleTableSearch()" title="Search this table">⌕</button><button class="soft" onclick="tableMenu(\''+esc(t.id)+'\')">⋮</button></div><div id="tableSearch" class="tableSearch '+(t.search?'open':'')+'"><input id="tableSearchInput" value="'+esc(t.search||'')+'" placeholder="Search this table..." oninput="setTableSearch(this.value)"></div><div class="tableStatus"><span class="muted">'+rows.length+' of '+t.rows.length+' rows · '+t.columns.length+' columns'+(groupCol?' · grouped by '+esc(groupCol.name):'')+(t.search?' · search: '+esc(t.search):'')+'</span>'+(activeFilterCount?'<button class="soft" onclick="clearAllFilters()">Clear filters ('+activeFilterCount+')</button>':'')+'</div>'+(selectedRows.size?'<div class="selectionBar" id="selectionBar"><span class="count">'+selectedRows.size+' selected</span><button onclick="selectAllVisible()">Select all</button><button onclick="clearSelection()">Clear</button><button onclick="moveSelectedModal()">Arrange</button><button class="danger" onclick="deleteSelected()">Delete</button><button class="primary" onclick="addRow()">＋ Add</button></div>':'')+'<div class="scroll"><table class="grid"><thead><tr>'+headers+'</tr></thead><tbody>'+rowsHtml+'</tbody></table></div>' +(amountCols.length?'<div class="totalDock">'+totalCells+'</div>':'')+'<div class="tableBottomBar"><div class="barInner"><button onclick="manageColumns(\''+esc(t.id)+'\')" title="Manage columns" aria-label="Manage columns"><span class="barIcon">☷</span></button><button onclick="addRow()" title="Add rows" aria-label="Add rows"><span class="barIcon">＋</span></button><button onclick="groupByModal()" title="Group rows" aria-label="Group rows" class="'+(t.groupBy?'active':'')+'"><span class="barIcon">▤</span></button><button class="'+(activeFilterCount?'active':'')+'" onclick="savedFiltersModal()" title="Filter" aria-label="Filter"><span class="barIcon">⏷</span></button><button onclick="tableMore()" title="More" aria-label="More"><span class="barIcon">⋮</span></button></div></div>';
  bindRowLongPress();bindHeaderLongPress();
  let sc=$('app').querySelector('.scroll'),td=$('app').querySelector('.totalDock');
  if(sc&&td){sc.addEventListener('scroll',()=>{td.scrollLeft=sc.scrollLeft});td.addEventListener('scroll',()=>{sc.scrollLeft=td.scrollLeft})}
  if(t.search)setTimeout(()=>{$('tableSearchInput')?.focus()},50);
}
function toggleTableSearch(){let e=$('tableSearch');if(!e)return;e.classList.toggle('open');if(e.classList.contains('open'))setTimeout(()=>{$('tableSearchInput')?.focus()},50);else{let t=getT(state.active);if(t){t.search='';save();renderTable(t)}}}
function refreshTableRowsOnly(t){
  let sc=document.querySelector('.scroll');
  if(!sc)return;
  let groupColId=t.groupBy||'',groupCol=groupColId?t.columns.find(c=>c.id===groupColId):null;
  let rows=visibleRows(t);
  let rowsHtml=groupCol?renderGroupedRows(t,groupCol,rows):rows.map(x=>renderRow(t,x.r,x.i)).join('');
  let tbody=sc.querySelector('.grid tbody');
  if(tbody){tbody.innerHTML=rowsHtml;}
  let status=document.querySelector('.tableStatus .muted');
  if(status)status.innerHTML=esc(rows.length+' of '+t.rows.length+' rows · '+t.columns.length+' columns'+(groupCol?' · grouped by '+groupCol.name:'')+(t.search?' · search: '+t.search:''));
  let total=document.querySelector('.totalDock');
  if(total){let visibleCols=t.columns.filter(c=>!c.hidden);total.innerHTML='<div class="totalDockInner"><div class="totalCell no">Σ</div>'+visibleCols.map((c,i)=>c.type==='amount'?'<div class="totalCell amount '+(c.pinned?'pinned':'')+'" style="width:'+colWidth(c)+'px;min-width:'+colWidth(c)+'px;'+(c.pinned?'left:'+pinnedLeft(t,i)+'px;':'')+'">'+currency()+' '+formatNum(totalAmountVisible(t,c))+'</div>':(i===0?'<div class="totalCell label">Total</div>':'<div class="totalCell" style="width:'+colWidth(c)+'px;min-width:'+colWidth(c)+'px;"></div>')).join('')+'</div>';}
  bindRowLongPress();bindHeaderLongPress();
  requestAnimationFrame(()=>{if(t.search)scrollToSearchHit()});

function manageColumns(id){let t=getT(id||state.active);if(!t)return;state.active=t.id;show('<div class="modalTop"><h2>Manage Columns</h2><button onclick="closeModal()">✕</button></div><p class="muted">Reorder, rename, change type, hide, pin or manage dropdown options.</p><div class="manageList">'+t.columns.map((c,i)=>'<div class="manageItem"><span class="dragHandle">☷</span><button class="mini soft" onclick="moveCol('+i+',-1)">↑</button><button class="mini soft" onclick="moveCol('+i+',1)">↓</button><div class="grow"><b>'+esc(c.name)+'</b><div class="muted">'+esc(TYPES.find(x=>x[0]===c.type)?.[1]||c.type)+(c.pinned?' · Pinned':'')+'</div></div><button class="mini soft" onclick="toggleColumnHidden('+i+')">'+(c.hidden?'Show':'Hide')+'</button><button class="mini soft" onclick="toggleColumnPin('+i+')">'+(c.pinned?'Unpin':'Pin')+'</button><button class="mini soft" onclick="editColumnDialog('+i+')">Edit</button><button class="mini danger" onclick="removeCol('+i+')">Delete</button></div>').join('')+'</div><button class="soft" style="width:100%;margin-top:10px" onclick="addCol()">＋ Add column</button><div class="footer"><button class="primary" onclick="closeModal();renderTable(getT(state.active))">Done</button></div>')}
function editColumnDialog(i){let t=getT(state.active),c=t?.columns[i];if(!t||!c)return;show('<div class="modalTop"><h2>Edit Column</h2><button onclick="manageColumns(\''+esc(t.id)+'\')">←</button></div><div class="field"><label>Column name</label><input id="editColName" value="'+esc(c.name)+'"></div><div class="field"><label>Column width (% of screen)</label><input id="editColWidth" type="number" min=5 max=100 step=1 value="'+(Number(c.widthPct)||Math.min(100,Math.max(10,Math.round(colWidth(c)/Math.max(1,window.innerWidth)*100))) )+'"><small class="muted">5–100% of screen width</small></div><div class="field"><label>Cell text alignment</label><select id="editColAlign"><option value="left" '+((c.align||'left')==='left'?'selected':'')+'>Left</option><option value="center" '+(c.align==='center'?'selected':'')+'>Center</option><option value="right" '+(c.align==='right'?'selected':'')+'>Right</option></select></div><div class="field"><label>Type</label><select id="editColType">'+TYPES.map(x=>'<option value="'+x[0]+'" '+(c.type===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></div>'+(c.type==='formula'?'<button class="soft" style="width:100%" onclick="closeModal();formulaModal(0,\''+esc(c.id)+'\')">ƒx Edit formula</button>':'')+((c.type==='select'||c.type==='status')?'<button class="soft" style="width:100%;margin-top:8px" onclick="closeModal();optionsModal('+i+')">☷ Manage dropdown options ('+(c.options||[]).length+')</button>':'')+'<div class="footer"><button onclick="manageColumns(\''+esc(t.id)+'\')">Cancel</button><button class="primary" onclick="saveColumnEdit('+i+')">Save</button></div>')}
function saveColumnEdit(i){let t=getT(state.active),c=t?.columns[i];if(!t||!c)return;c.name=$('editColName').value.trim()||c.name;c.type=$('editColType').value;c.widthPct=Math.max(5,Math.min(100,Number($('editColWidth')?.value)||25));c.width=Math.max(80,Math.round(window.innerWidth*c.widthPct/100));c.align=['left','center','right'].includes($('editColAlign')?.value)?$('editColAlign').value:'left';if(c.type==='status'&&!c.options?.length)c.options=['Pending','In Progress','Done','Cancelled'];save();manageColumns(t.id);toast('Column updated')}
function toggleColumnHidden(i){let t=getT(state.active);if(!t)return;t.columns[i].hidden=!t.columns[i].hidden;save();manageColumns(t.id);toast(t.columns[i].hidden?'Column hidden':'Column shown')}
function toggleColumnPin(i){let t=getT(state.active);if(!t)return;t.columns[i].pinned=!t.columns[i].pinned;save();manageColumns(t.id);toast(t.columns[i].pinned?'Column pinned':'Column unpinned')}
function columnMenu(colId){let t=getT(state.active),c=t?.columns.find(x=>x.id===colId);if(!t||!c)return;show('<div class="modalTop"><h2>'+esc(c.name)+'</h2><button onclick="closeModal()">✕</button></div><div class="columnMenuGrid"><button class="actionItem" onclick="closeModal();editColumnDialog('+t.columns.indexOf(c)+')"><span class="ai">✎</span>Edit Column <small class="muted">Long-press the header</small></button><button class="actionItem" onclick="closeModal();filterOrGraph(\''+esc(c.id)+'\')"><span class="ai">⚑</span>Filter / Graph</button><button class="actionItem" onclick="sortColumn(\''+esc(c.id)+'\',1)"><span class="ai">↑</span>Sort Ascending</button><button class="actionItem" onclick="sortColumn(\''+esc(c.id)+'\',-1)"><span class="ai">↓</span>Sort Descending</button><button class="actionItem" onclick="toggleColumnPin('+t.columns.indexOf(c)+')"><span class="ai">⚑</span>'+(c.pinned?'Unpin column':'Pin column')+'</button><button class="actionItem" onclick="closeModal();groupByColumn(\''+esc(c.id)+'\')"><span class="ai">☷</span>Group</button></div>')}
function sortColumn(colId,dir){let t=getT(state.active),c=t?.columns.find(x=>x.id===colId);if(!t||!c)return;t.rows.sort((a,b)=>{let av=a[c.id]??'',bv=b[c.id]??'';let an=Number(av),bn=Number(bv);if(c.type==='amount'||c.type==='number'||c.type==='date'||c.type==='time'){if(Number.isFinite(an)&&Number.isFinite(bn))return(an-bn)*dir}return String(av).localeCompare(String(bv),undefined,{numeric:true,sensitivity:'base'})*dir});save();closeModal();renderTable(t);toast('Sorted '+(dir>0?'ascending':'descending'))}
function groupByColumn(id){let t=getT(state.active);if(!t)return;t.groupBy=id;save();renderTable(t);toast('Grouped by column')}
function filterOrGraph(id){let t=getT(state.active),c=t?.columns.find(x=>x.id===id);if(!t||!c)return;show('<div class="modalTop"><h2>'+esc(c.name)+'</h2><button onclick="closeModal()">✕</button></div><div class="actionList"><button class="actionItem" onclick="closeModal();filterColumn(\''+esc(id)+'\')"><span class="ai">⚑</span>Filter</button><button class="actionItem" onclick="graphColumn(\''+esc(id)+'\')"><span class="ai">▥</span>Graph</button></div>')}
function graphColumn(id){let t=getT(state.active),c=t?.columns.find(x=>x.id===id);if(!t||!c)return;let m=new Map();t.rows.forEach(r=>{let v=String(r[id]??'').trim()||'(blank)';m.set(v,(m.get(v)||0)+1)});let a=[...m.entries()].sort((x,y)=>y[1]-x[1]).slice(0,12),mx=Math.max(1,...a.map(x=>x[1]));show('<div class="modalTop"><h2>'+esc(c.name)+' — Graph</h2><button onclick="closeModal()">✕</button></div><p class="muted">Top value counts in this column.</p><div style="display:grid;gap:10px">'+(a.length?a.map(x=>'<div><div style="display:flex;justify-content:space-between;font-size:13px"><span>'+esc(x[0])+'</span><b>'+x[1]+'</b></div><div style="height:10px;background:var(--bg);border-radius:8px;overflow:hidden"><div style="height:100%;width:'+Math.round(x[1]/mx*100)+'%;background:var(--pri);border-radius:8px"></div></div></div>').join(''):'<p class="muted">No data.</p>')+'</div><div class="footer"><button class="soft" onclick="closeModal();filterColumn(\''+esc(id)+'\')">Filter</button><button class="primary" onclick="closeModal()">Done</button></div>')}
function customDateFilter(id){
  show('<div class="modalTop"><h2>Custom Range</h2><button onclick="closeModal();filterColumn(\''+esc(id)+'\')">←</button></div><div class="field"><label>From</label><input id="dateFrom" type="date"></div><div class="field"><label>To</label><input id="dateTo" type="date"></div><div class="footer"><button class="soft" onclick="closeModal()">Cancel</button><button class="primary" onclick="applyCustomDate(\''+esc(id)+'\')">Apply</button></div>');
}
function applyCustomDate(id){let a=$('dateFrom')?.value,b=$('dateTo')?.value;if(!a||!b||a>b){toast('Choose a valid date range');return}let t=getT(state.active);if(!t)return;t.filters=t.filters||{};t.filters[id]={mode:'dateRange',from:a,to:b};save();closeModal();renderTable(t);toast('Date range applied')}
function filterColumn(id){let t=getT(state.active),c=t?.columns.find(x=>x.id===id);if(!t||!c)return;let vals=[...new Set(t.rows.map(r=>String(r[id]??'')).filter((v,i,a)=>a.indexOf(v)===i))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));let current=t.filters?.[id];let selected=new Set(Array.isArray(current?.values)?current.values:vals);let chips=c.type==='date'?'<div class="filterChips"><button class="filterChip" onclick="customDateFilter(\''+esc(id)+'\')">Custom Range</button><button class="filterChip" onclick="setDateQuick(\''+esc(id)+'\',\'today\')">Today</button><button class="filterChip" onclick="setDateQuick(\''+esc(id)+'\',\'yesterday\')">Yesterday</button><button class="filterChip" onclick="setDateQuick(\''+esc(id)+'\',\'last7\')">Last 7 days</button><button class="filterChip" onclick="setDateQuick(\''+esc(id)+'\',\'thismonth\')">This month</button><button class="filterChip" onclick="setDateQuick(\''+esc(id)+'\',\'lastmonth\')">Last month</button></div>':'';show('<div class="modalTop"><button class="headerIcon" onclick="closeModal()">←</button><h2>'+esc(c.name)+'</h2><button class="primary" onclick="applyColumnFilter(\''+esc(id)+'\')">Apply</button></div>'+chips+'<div style="display:flex;justify-content:space-between;margin:4px 0 8px"><button class="headerIcon" onclick="selectAllFilterValues(\''+esc(id)+'\')">Select all</button><button class="headerIcon" onclick="clearFilterValues(\''+esc(id)+'\')">Clear All</button></div><input class="search" id="filterSearch" placeholder="Search values..." oninput="filterValueList(this.value)"><div class="valueList" id="filterValues">'+(vals.length?vals.map(v=>'<label class="valueRow"><input type="checkbox" class="filterValue" value="'+esc(v)+'" '+(selected.has(v)?'checked':'')+'><span>'+esc(v||'(blank)')+'</span></label>').join(''):'<p class="muted">No values yet.</p>')+'</div><div class="footer"><button class="soft" onclick="saveCurrentFilter(\''+esc(id)+'\')">Save filter</button><button class="primary" onclick="applyColumnFilter(\''+esc(id)+'\')">Apply</button></div>')}
function filterValueList(q){document.querySelectorAll('#filterValues .valueRow').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q.toLowerCase())?'flex':'none')}
function selectAllFilterValues(){document.querySelectorAll('.filterValue').forEach(x=>x.checked=true)}function clearFilterValues(){document.querySelectorAll('.filterValue').forEach(x=>x.checked=false)}
function applyColumnFilter(id){let t=getT(state.active);if(!t)return;let checks=[...document.querySelectorAll('.filterValue:checked')].map(x=>x.value);let all=[...document.querySelectorAll('.filterValue')].map(x=>x.value);t.filters=t.filters||{};if(checks.length===all.length)delete t.filters[id];else t.filters[id]={values:checks};save();closeModal();renderTable(t);toast('Filter applied')}
function dateIso(d){return d.toISOString().slice(0,10)}
function setDateQuick(id,kind){let now=new Date();let from=new Date(now),to=new Date(now);if(kind==='yesterday'){from.setDate(now.getDate()-1);to.setDate(now.getDate()-1)}else if(kind==='last7'){from.setDate(now.getDate()-6)}else if(kind==='thismonth'){from=new Date(now.getFullYear(),now.getMonth(),1);to=new Date(now.getFullYear(),now.getMonth()+1,0)}else if(kind==='lastmonth'){from=new Date(now.getFullYear(),now.getMonth()-1,1);to=new Date(now.getFullYear(),now.getMonth(),0)}let t=getT(state.active);if(!t)return;t.filters=t.filters||{};t.filters[id]={mode:'dateRange',from:dateIso(from),to:dateIso(to)};save();closeModal();renderTable(t);toast('Date filter applied')}
function saveCurrentFilter(id){let t=getT(state.active);if(!t)return;let checks=[...document.querySelectorAll('.filterValue:checked')].map(x=>x.value);t.savedFilters=t.savedFilters||[];t.savedFilters.push({id:'sf'+Date.now(),name:t.columns.find(c=>c.id===id)?.name+' filter '+(t.savedFilters.length+1),filters:{[id]:{values:checks}}});save();closeModal();savedFiltersModal();toast('Filter saved')}
function savedFiltersModal(){let t=getT(state.active);if(!t)return;let list=(t.savedFilters||[]).map(f=>'<div class="savedFilterCard"><span>'+esc(f.name)+'</span><button class="soft" onclick="applySavedFilter(\''+esc(f.id)+'\')">Apply</button><button class="danger" onclick="deleteSavedFilter(\''+esc(f.id)+'\')">×</button></div>').join('');let cols=t.columns.filter(c=>!c.hidden).map(c=>'<button class="actionItem" onclick="closeModal();filterColumn(\''+esc(c.id)+'\')"><span class="ai">⏷</span>Filter by '+esc(c.name)+(t.filters?.[c.id]?' <small class="muted">· Active</small>':'')+'</button>').join('');show('<div class="modalTop"><h2>Filter</h2><button class="headerIcon" onclick="closeModal()">✕</button></div><h3 class="muted">Filter by column</h3><div class="columnMenuGrid">'+cols+'</div><h3 class="muted" style="margin-top:18px">Saved filters</h3>'+(list||'<p class="muted">No saved filters yet.</p>'))}
function applySavedFilter(fid){let t=getT(state.active),f=(t.savedFilters||[]).find(x=>x.id===fid);if(!t||!f)return;t.filters=JSON.parse(JSON.stringify(f.filters||{}));save();closeModal();renderTable(t);toast('Saved filter applied')}
function deleteSavedFilter(fid){let t=getT(state.active);if(!t)return;t.savedFilters=(t.savedFilters||[]).filter(f=>f.id!==fid);save();savedFiltersModal()}
function clearAllFilters(){let t=getT(state.active);if(!t)return;t.filters={};save();renderTable(t);toast('Filters cleared')}
function tableMore(){show('<div class="modalTop"><h2>More</h2><button onclick="closeModal()">✕</button></div><div class="actionList"><button class="actionItem" onclick="closeModal();addRow()"><span class="ai">＋</span>Add row</button><button class="actionItem" onclick="closeModal();groupByModal()"><span class="ai">☷</span>Group rows</button><button class="actionItem" onclick="closeModal();csv()"><span class="ai">↗</span>Export CSV</button><button class="actionItem" onclick="closeModal();backup()"><span class="ai">💾</span>Backup all tables</button><button class="actionItem" onclick="tableMenu(state.active)"><span class="ai">⚙</span>Table settings</button></div>')}
function shareTable(){let t=getT(state.active);if(!t)return;let text=t.name+' — '+t.rows.length+' rows, '+t.columns.length+' columns';if(navigator.share)navigator.share({title:t.name,text}).catch(()=>{});else{navigator.clipboard?.writeText(text);toast('Table summary copied')}}

function moveCol(i,d){let t=getT(state.active);if(!t)return;let j=i+d;if(j<0||j>=t.columns.length)return;let tmp=t.columns[i];t.columns[i]=t.columns[j];t.columns[j]=tmp;save();manageColumns(t.id);toast('Column moved')}
function editCol(i,k,v){let t=getT(state.active);if(!t)return;t.columns[i][k]=v;save();manageColumns(t.id)}function addCol(){let t=getT(state.active);t.columns.push({id:'c'+Date.now()+Math.random().toString(16).slice(2),name:'New Column',type:'text',formula:'',options:[],pinned:false,hidden:false,width:140});save();manageColumns(t.id)}function removeCol(i){let t=getT(state.active);if(t.columns.length===1){toast('A table needs at least one column');return}let id=t.columns[i].id;askConfirm('Delete column','Delete this column and all of its data?',()=>{t.columns.splice(i,1);t.rows.forEach(r=>delete r[id]);save();columnsModal(t.id)},true)}
function optionsModal(i){
  let t=getT(state.active),c=t?.columns[i];if(!t||!c)return;
  c.options=Array.isArray(c.options)?c.options:[];
  let list=c.options.map((o,j)=>'<div class="optionItem" data-opt-index="'+j+'"><span class="dragDots" aria-label="Drag to rearrange"><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="optionName">'+esc(o)+'</span><button class="optionMore" onclick="optionActions(event,'+i+','+j+')" aria-label="More">⋮</button></div>').join('');
  show('<div class="optionEditor"><div class="modalTop"><h2 class="optionTitle">'+esc(c.name)+'</h2></div><div class="optionControls"><button class="optionControl active" title="Rearrange" aria-label="Rearrange">☷</button><button class="optionControl" title="Sort A–Z" aria-label="Sort A–Z" onclick="sortOptions('+i+')">≡</button></div><input id="newOptionInput" class="addItem" placeholder="Add item" autocomplete="off" onkeydown="if(event.key===\'Enter\'){event.preventDefault();addOptionFromInput('+i+')}"><div id="optionList" class="optionList">'+(list||'<p class="muted" style="text-align:center;padding:18px 0">No items yet.</p>')+'</div><div class="footer"><button class="soft" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveOptionEditor('+i+')">Save</button></div></div>');
}
function addOptionFromInput(i){
  let t=getT(state.active),c=t?.columns[i],e=$('newOptionInput');if(!c||!e)return;
  let v=e.value.trim();if(!v)return;
  c.options=Array.isArray(c.options)?c.options:[];
  if(c.options.some(x=>String(x).toLowerCase()===v.toLowerCase())){toast('Item already exists');return}
  c.options.push(v);save();optionsModal(i);setTimeout(()=>{$('newOptionInput')?.focus()},40);
}
function addOption(i){
  let t=getT(state.active),c=t?.columns[i];if(!c)return;
  c.options=Array.isArray(c.options)?c.options:[];
  let n=c.options.length+1;c.options.push('Option '+n);save();optionsModal(i);setTimeout(()=>{$('newOptionInput')?.focus()},40);
}
function optionActions(ev,i,j){
  ev.stopPropagation();document.querySelectorAll('.optionMenu').forEach(x=>x.remove());
  let menu=document.createElement('div');menu.className='optionMenu';
  menu.innerHTML='<button onclick="editOption('+i+','+j+')">Edit</button><button class="dangerItem" onclick="deleteOption('+i+','+j+')">Delete</button>';
  document.body.appendChild(menu);let r=ev.currentTarget.getBoundingClientRect();
  menu.style.left=Math.max(8,Math.min(window.innerWidth-140,r.right-140))+'px';menu.style.top=Math.min(window.innerHeight-90,r.bottom+6)+'px';
}
function editOption(i,j){
  document.querySelectorAll('.optionMenu').forEach(x=>x.remove());
  let t=getT(state.active),c=t?.columns[i];if(!c)return;
  let v=prompt('Edit item',c.options[j]||'');if(v===null)return;v=v.trim();if(!v)return;
  c.options[j]=v;save();optionsModal(i);
}
function deleteOption(i,j){
  document.querySelectorAll('.optionMenu').forEach(x=>x.remove());
  let t=getT(state.active),c=t?.columns[i];if(!c)return;let old=c.options[j];c.options.splice(j,1);
  t.rows.forEach(r=>{if(r[c.id]===old)r[c.id]='';if(Array.isArray(r[c.id]))r[c.id]=r[c.id].filter(v=>v!==old)});
  save();optionsModal(i);toast('Item deleted');
}
function sortOptions(i){
  let t=getT(state.active),c=t?.columns[i];if(!c)return;
  c.options=[...(c.options||[])].sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:'base'}));
  save();optionsModal(i);
}
function saveOptionEditor(i){save();closeModal();renderTable(getT(state.active));toast('Options saved')}
function bindOptionDrag(){
  const list=$('optionList');if(!list)return;let dragged=null;
  list.querySelectorAll('.optionItem').forEach(item=>{
    const handle=item.querySelector('.dragDots');
    handle.addEventListener('pointerdown',e=>{e.preventDefault();dragged=item;item.classList.add('dragging');try{handle.setPointerCapture(e.pointerId)}catch(_){}});
    handle.addEventListener('pointermove',e=>{
      if(!dragged)return;
      const target=[...list.querySelectorAll('.optionItem:not(.dragging)')].find(x=>{const r=x.getBoundingClientRect();return e.clientY<r.top+r.height/2});
      if(target)list.insertBefore(dragged,target);else list.appendChild(dragged);
    });
    handle.addEventListener('pointerup',()=>{
      if(!dragged)return;dragged.classList.remove('dragging');
      let t=getT(state.active),c=t?.columns[i];if(c){const order=[...list.querySelectorAll('.optionItem')].map(x=>Number(x.dataset.optIndex));const old=[...c.options];c.options=order.map(k=>old[k]);save()}
      dragged=null;
    });
    handle.addEventListener('pointercancel',()=>{dragged?.classList.remove('dragging');dragged=null});
  });
}

    '</div>');
}

function moveRowSave(i){let t=getT(state.active);let n=Math.max(1,Math.min(t.rows.length,Number($('moveRowTo')?.value)||i+1))-1;if(n===i){closeModal();return}let r=t.rows.splice(i,1)[0];t.rows.splice(n,0,r);save();closeModal();renderTable(t);toast('Row moved')}

}
function setRowStyle(i,v){let t=getT(state.active);if(!t)return;t.rows[i].__style=v;save();closeModal();renderTable(t);toast('Row style updated')}
function groupByModal(){
  let t=getT(state.active);if(!t)return;
  let opts='<option value="">No grouping</option>'+t.columns.map(c=>'<option value="'+esc(c.id)+'" '+(t.groupBy===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('');
  show('<div class="modalTop"><h2>Group rows</h2><button onclick="closeModal()">✕</button></div><p class="muted">Group rows by a column. Dropdown/select columns work especially well for this.</p><div class="field"><label>Group by</label><select id="groupChoice">'+opts+'</select></div><div class="footer"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveGroupBy()">Save</button></div>');
}
function saveGroupBy(){let t=getT(state.active);if(!t)return;t.groupBy=$('groupChoice')?.value||'';save();closeModal();renderTable(t);toast(t.groupBy?'Grouping enabled':'Grouping cleared')}
function askConfirm(title,message,onYes,danger){
  show('<div class="modalTop"><h2>'+title+'</h2><button onclick="closeModal()">✕</button></div><p>'+message+'</p><div class="footer"><button class="soft" onclick="closeModal()">Cancel</button><button class="'+(danger?'danger':'primary')+'" onclick="window.__confirmAction&&window.__confirmAction()">Confirm</button></div>');
  window.__confirmAction=()=>{let fn=onYes;window.__confirmAction=null;closeModal();fn()};
}
function askPrompt(title,label,value,onSave){
  show('<div class="modalTop"><h2>'+title+'</h2><button onclick="closeModal()">✕</button></div><div class="field"><label>'+label+'</label><input id="promptValue" value="'+esc(value)+'"></div><div class="footer"><button class="soft" onclick="closeModal()">Cancel</button><button class="primary" onclick="window.__promptAction&&window.__promptAction()">Save</button></div>');
  window.__promptAction=()=>{let v=$('promptValue')?.value.trim();window.__promptAction=null;if(v){closeModal();onSave(v)}};setTimeout(()=>{$('promptValue')?.focus();$('promptValue')?.select()},50);
}
function tableMenu(id){let t=getT(id);if(!t)return;editingTable=t.id;state.active=t.id;show('<div class="modalTop"><h2>'+esc(t.name)+'</h2><button onclick="closeModal()">✕</button></div><button class="soft" style="width:100%;margin:4px 0" onclick="renameTable()">✏ Rename</button><button class="soft" style="width:100%;margin:4px 0" onclick="closeModal();columnsModal(\''+esc(id)+'\')">⚙ Customize columns</button><button class="soft" style="width:100%;margin:4px 0" onclick="folderForTable()">📁 Move to folder</button><button class="soft" style="width:100%;margin:4px 0" onclick="duplicateTable()">📑 Duplicate table</button><button class="soft" style="width:100%;margin:4px 0" onclick="backup()">💾 Backup all</button><button class="soft" style="width:100%;margin:4px 0" onclick="csv()">📄 Export CSV</button><button class="danger" style="width:100%;margin:4px 0" onclick="deleteTable()">🗑 Delete table</button>')}
function renameTable(){let t=getT(editingTable);if(!t)return;askPrompt('Rename table','Table name',t.name,n=>{if(n){t.name=n;save();closeModal();renderTable(t);toast('Renamed')}})}
function folderForTable(){let t=getT(editingTable);if(!t)return;show('<div class="modalTop"><h2>Move table</h2><button onclick="closeModal()">✕</button></div><div class="field"><label>Folder</label><select id="moveFolder"><option value="">No folder</option>'+state.folders.map(f=>'<option value="'+esc(f.id)+'" '+(t.folderId===f.id?'selected':'')+'>📁 '+esc(f.name)+'</option>').join('')+'</select></div><div class="footer"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="moveTable()">Save</button></div>')}
function moveTable(){let t=getT(editingTable);t.folderId=$('moveFolder').value;save();closeModal();renderHome();toast('Folder updated')}
function duplicateTable(){let t=getT(editingTable),c=JSON.parse(JSON.stringify(t));c.id='t'+Date.now();c.name=t.name+' Copy';state.tables.push(c);save();closeModal();renderHome();toast('Duplicated')}
function deleteTable(){let t=getT(editingTable);if(!t)return;askConfirm('Delete table','Delete '+esc(t.name)+'?',()=>{state.tables=state.tables.filter(x=>x.id!==editingTable);state.active=null;save();closeModal();renderHome();toast('Deleted')},true)}
function folderModal(){show('<div class="modalTop"><h2>Folders</h2><button onclick="closeModal()">✕</button></div><p class="muted">Keep related tables together. A table can belong to one folder.</p>'+state.folders.map((f,i)=>'<div class="optionRow"><input value="'+esc(f.name)+'" onchange="renameFolder('+i+',this.value)"><button class="danger" onclick="deleteFolder('+i+')">×</button></div>').join('')+'<button class="soft" onclick="addFolder()">＋ Add folder</button><div class="footer"><button class="primary" onclick="closeModal();renderHome()">Done</button></div>')}
function addFolder(){state.folders.push({id:'f'+Date.now()+Math.random().toString(16).slice(2),name:'New Folder'});save();folderModal()}function renameFolder(i,v){if(v.trim())state.folders[i].name=v.trim();save();renderFolderModalKeep()}function renderFolderModalKeep(){folderModal()}function deleteFolder(i){let f=state.folders[i];if(!f)return;askConfirm('Delete folder','Delete '+esc(f.name)+'? Tables will remain.',()=>{state.tables.forEach(t=>{if(t.folderId===f.id)t.folderId=''});state.folders.splice(i,1);save();folderModal()},true)}
function download(b,n){let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function backup(){download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'tableflow-backup.json');closeModal();toast('Backup exported')}
function restorePick(){closeModal();let i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{let f=i.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{state=normalize(JSON.parse(r.result));save();folderFilter='all';renderHome();toast('Restored')}catch(e){show('<div class="modalTop"><h2>Restore failed</h2><button onclick="closeModal()">✕</button></div><p>The selected backup file could not be read as a valid TableFlow backup.</p><div class="footer"><button class="primary" onclick="closeModal()">OK</button></div>')}};r.readAsText(f)};i.click()}
function csv(){let t=getT(editingTable||state.active);if(!t)return;let rows=[t.columns.map(c=>c.name),...t.rows.map(r=>t.columns.map(c=>c.type==='formula'?calc(c,r):r[c.id]??''))],s=rows.map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');download(new Blob([s],{type:'text/csv'}),t.name.replace(/\W+/g,'_')+'.csv');closeModal();toast('CSV exported')}
function exportCurrentCSV(){if(!state.active){toast('Open a table first');return}csv()}function showAbout(){show('<div class="modalTop"><h2>TableFlow</h2><button onclick="closeModal()">✕</button></div><p>Flexible generic tables for everyday notes and records.</p><p class="muted">Offline-first · Local storage · Custom columns · Formulas · Images · Dropdowns · Folders · Totals</p><div class="footer"><button class="primary" onclick="closeModal()">Done</button></div>')}
function setTheme(v){localStorage.setItem('my_tables_theme',v);applyTheme(v)}function applyTheme(v){document.documentElement.dataset.theme=v==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':''):v}
(()=>{let t=localStorage.getItem('my_tables_theme')||'auto';applyTheme(t);$('themeChoice').value=t;let c=localStorage.getItem('my_tables_currency');if(c)$('currencyChoice').value=c;let d=localStorage.getItem('my_tables_date_format');if(d)$('dateChoice').value=d})();
let currentView='home',leaveGuardReady=false,leavingApp=false;
function setView(v){currentView=v}
function armLeaveGuard(){
  if(leaveGuardReady)return;
  leaveGuardReady=true;
  try{
    history.pushState({tableflowGuard:true,view:'home'},'',location.href);
    window.addEventListener('popstate',onLeavePop);
  }catch(e){}
}
function openTable(id){
  let t=getT(id);if(!t)return;
  state.active=t.id;save();
  if(currentView==='home'){try{history.pushState({tableflowView:'table',id:t.id},'',location.href)}catch(e){}}
  setView('table');renderTable(t);if(pendingSearchTarget){let target=pendingSearchTarget;pendingSearchTarget=null;requestAnimationFrame(()=>setTimeout(()=>scrollToSearchHit(target.row),80))}
}
function backToHome(){
  if(currentView==='table'){let t=getT(state.active);if(t){t.search='';save()}pendingSearchTarget=null;selectedRows.clear();try{history.back()}catch(e){renderHome()}}else renderHome();
}
function onLeavePop(e){
  if(currentView==='table'){
    setView('home');renderHome();return;
  }
  show('<div class="modalTop"><h2>Leave TableFlow?</h2><button onclick="closeModal()">✕</button></div><p>Your saved tables stay on this device. Do you want to leave the app?</p><div class="footer"><button class="soft" onclick="closeModal();history.pushState({tableflowGuard:true,view:\'home\'},\'\',location.href)">Stay</button><button class="danger" onclick="leaveApp()">Leave</button></div>');
}
function leaveApp(){
  closeModal();
  try{history.back()}catch(e){}
}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));renderHome();armLeaveGuard();
</script>
</body></html>
