<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b3a"><link rel="manifest" href="./manifest.json"><title>TableFlow</title><style>
:root{--bg:#f4f8f5;--card:#fff;--ink:#15231a;--muted:#6e7b73;--line:#cbd8cf;--pri:#176b3a;--soft:#e7f3eb;--danger:#c62828}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:1200px;margin:auto;padding:14px}.top{display:flex;align-items:center;gap:10px;min-height:48px}.top h1{font-size:20px;margin:0;flex:1}.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 12px;user-select:none;-webkit-user-select:none;touch-action:manipulation}.primary{background:var(--pri);color:#fff;border-color:var(--pri)}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin:10px 0}.homeTop{position:fixed;left:0;right:0;top:0;z-index:800;background:var(--pri);color:#fff;border-bottom:1px solid #ffffff33;box-shadow:0 3px 16px #0002;padding:8px 14px}.homeTop .btn{background:#ffffff1c;color:#fff;border-color:#ffffff3d}.homeTop .primary{background:#fff;color:var(--pri);border-color:#fff}.homeSpacer{height:62px}.menuHeader{background:var(--pri);color:#fff;border-radius:16px 16px 0 0;margin:-18px -18px 14px;padding:16px 18px}.menuHeader h2{color:#fff;margin:0}.menuHeader .muted{color:#dcefe3}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;cursor:pointer}.card b{display:block}.cardHead{display:flex;align-items:center;gap:8px}.cardHead b{flex:1}.cardMenuBtn{width:38px;height:38px;padding:0;border-radius:10px;font-size:22px}.cardMenuBtn:focus{outline:2px solid var(--pri)}.muted{color:var(--muted);font-size:12px}.empty{text-align:center;padding:50px 15px;color:var(--muted)}.tableWrap{overflow:auto;border:1px solid var(--line);background:var(--card);max-height:calc(100vh - 170px);position:relative}.grid{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}.grid th,.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;min-width:130px;height:42px;background:var(--card);position:relative}.grid th{position:sticky;top:0;background:var(--pri);color:#fff;z-index:20;padding:9px;text-align:left;user-select:none}.grid th:first-child,.grid td:first-child{position:sticky;left:0;min-width:52px;width:52px;z-index:25;text-align:center}.grid th:first-child{background:var(--pri)}.grid td:first-child{background:var(--soft);color:var(--pri);font-weight:750;border-right:2px solid var(--pri)}.grid th.pinnedHeader{position:sticky!important;z-index:22;background:var(--pri);box-shadow:3px 0 0 var(--pri)}.grid td.pinnedCell{position:sticky;z-index:8;background:var(--card);box-shadow:3px 0 0 var(--pri)}.cellInput{width:100%;height:100%;min-height:40px;border:0;outline:0;background:transparent;padding:9px;color:inherit}.cellInput:focus{box-shadow:inset 0 0 0 2px #8ac7a1}.selectCell{width:100%;min-height:40px;border:0;background:transparent;padding:9px;text-align:left}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--pri);font-weight:650}.dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:500;display:flex;justify-content:center;gap:8px;padding:8px calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom))}.dock button{flex:1 1 0;max-width:none;min-width:0;padding:8px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;user-select:none;-webkit-user-select:none;touch-action:manipulation}.dock .dockIcon{font-size:19px;line-height:1}.dock .dockLabel{white-space:nowrap}.total{position:fixed;left:0;right:0;bottom:58px;z-index:300;background:var(--card);border-top:1px solid var(--line);padding:8px 14px;font-weight:750;overflow:auto}.modal{position:fixed;inset:0;background:#0007;z-index:2000;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{background:var(--card);width:min(760px,100%);max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px;box-shadow:0 -12px 40px #0003}.sheet h2{margin:0 0 12px}.sheet .row{display:flex;gap:7px;align-items:center;margin:7px 0}.sheet input,.sheet select{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}.option{display:flex;gap:6px;align-items:center;margin:6px 0}.hit{outline:3px solid #f1c40f;outline-offset:-3px}.menu{position:fixed;z-index:3000;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 35px #0004;padding:8px;min-width:220px}.menu button{display:block;width:100%;text-align:left;background:transparent;border:0;padding:10px;border-radius:10px}.menu button:hover{background:var(--soft)}.gridIcon{font-size:20px}.list .cards{display:block}.list .card{margin-bottom:8px}@media(max-width:650px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.app{padding:10px;padding-top:72px}.card{padding:12px}.dock button{padding:7px 2px;font-size:11px}.homeTop{padding-left:10px;padding-right:10px}}
</style></head><body><main id="app" class="app"></main><div id="modal" class="modal"><div id="sheet" class="sheet"></div></div><div id="ctx" class="menu" style="display:none"></div><script>
'use strict';
const KEY='tableflow_data_v76',OLD='my_tables_generic_v2';
const appEl=document.getElementById('app'),modalEl=document.getElementById('modal'),sheetEl=document.getElementById('sheet');
let state=normalize(read(KEY)||read(OLD)||{tables:[],active:null});
function normalize(x){if(!x||typeof x!=='object')return {tables:[],active:null}; if(!Array.isArray(x.tables))x.tables=[]; x.tables=x.tables.filter(t=>t&&typeof t==='object').map(t=>{t.id=t.id||id();t.name=String(t.name||'Untitled');t.columns=Array.isArray(t.columns)?t.columns:[];t.rows=Array.isArray(t.rows)?t.rows:[];t.filters=t.filters&&typeof t.filters==='object'?t.filters:{};t.columns=t.columns.map(c=>{c.id=c.id||id();c.name=String(c.name||'Column');c.type=c.type||'text';c.width=Number(c.width)||140;if((c.type==='select'||c.type==='status')&&!Array.isArray(c.options))c.options=c.type==='status'?['Pending','In Progress','Done','Cancelled']:['Option 1','Option 2'];return c});if(!t.columns.length)t.columns=[{id:id(),name:'Name',type:'text',width:150}];return t}); if(!Array.isArray(x.folders))x.folders=['General']; if(!x.folders.includes('General'))x.folders.unshift('General'); x.tables.forEach(t=>{t.folder=String(t.folder||'General');if(!x.folders.includes(t.folder))x.folders.push(t.folder)}); if(!x.tables.some(t=>t.id===x.active))x.active=null; return x;}

function read(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function table(){return state.tables.find(t=>t.id===state.active)}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function modal(html){sheetEl.innerHTML=html;modalEl.classList.add('show')}function closeModal(){modalEl.classList.remove('show');sheetEl.innerHTML=''}function toast(x){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.style='position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:4000;background:#15231a;color:white;padding:10px 14px;border-radius:12px';document.body.appendChild(e)}e.textContent=x;clearTimeout(window._toast);window._toast=setTimeout(()=>e.remove(),1800)}
function home(){state.active=null;save();appEl.innerHTML='<div class="homeTop"><div class="top"><button class="btn" onclick="menu()" aria-label="Menu">☰</button><h1>TableFlow</h1><button class="btn gridIcon" onclick="toggleView()" aria-label="Change view">▦</button><button class="btn primary" onclick="newTable()" aria-label="New table">＋</button></div></div><div class="homeSpacer"></div><input id="universal" class="search" placeholder="Search all tables and data…" oninput="universalSearch(this.value)"><div id="cards"></div>';drawCards();}
let view=localStorage.getItem('tableflow_view')||'grid';function toggleView(){view=view==='grid'?'list':'grid';localStorage.setItem('tableflow_view',view);drawCards()}function drawCards(q=''){let a=state.tables.filter(t=>!q||JSON.stringify(t).toLowerCase().includes(q.toLowerCase()));const cardsEl=document.getElementById('cards');cardsEl.innerHTML=a.length?'<div class="cards">'+a.map(t=>'<div class="card" onclick="openTable(\''+t.id+'\')"><div class="cardHead"><b>'+esc(t.name)+'</b><button class="btn cardMenuBtn" aria-label="Table options" onclick="event.stopPropagation();tableListMenu(\''+t.id+'\',event)">⋮</button></div><span class="muted">'+t.columns.length+' columns · '+t.rows.length+' rows'+(t.folder?' · '+esc(t.folder):'')+'</span></div>').join('')+'</div>':'<div class="empty">No tables found</div>';cardsEl.parentElement.classList.toggle('list',view==='list')}
function universalSearch(q){drawCards(q);if(q&&state.tables.length){let found=null;for(const t of state.tables){for(let i=0;i<t.rows.length;i++){if(JSON.stringify(t.rows[i]).toLowerCase().includes(q.toLowerCase())){found={t,i};break}}if(found)break}if(found){openTable(found.t.id);setTimeout(()=>{const tr=document.querySelector('tr[data-row="'+found.i+'"]');if(tr){tr.scrollIntoView({block:'center'});tr.classList.add('hit')}},80)}}}
function newTable(){let n=prompt('Table name','New Table');if(!n?.trim())return;state.tables.push({id:id(),name:n.trim(),columns:[{id:id(),name:'Name',type:'text',width:150}],rows:[],filters:{}});save();openTable(state.tables.at(-1).id)}
function openTable(i){state.active=i;save();renderTable()}function backHome(){home()}
function pinnedLeft(t,idx){let left=52;for(let j=0;j<idx;j++){if(t.columns[j].pinned&&!t.columns[j].hidden)left+=Number(t.columns[j].width)||140}return left}
function renderTable(){let t=table();if(!t){home();return}let visible=t.columns.filter(c=>!c.hidden);let headers=visible.map((c,ci)=>'<th data-col="'+c.id+'" class="'+(c.pinned?'pinnedHeader':'')+'" style="width:'+(c.width||140)+'px;'+(c.pinned?'left:'+pinnedLeft(t,t.columns.indexOf(c))+'px;':'')+'">'+esc(c.name)+'<span class="v75-resizer" onpointerdown="resizeStart(event,\''+c.id+'\')"></span></th>').join('');let renderRows=t.rows.map((r,i)=>({r,i}));if(t.groupBy)renderRows.sort((a,b)=>String(a.r[t.groupBy]??'').localeCompare(String(b.r[t.groupBy]??''),undefined,{numeric:true}));let body=renderRows.map(({r,i})=>'<tr data-row="'+i+'"><td onclick="rowMenu('+i+',event)">'+(i+1)+'</td>'+visible.map(c=>'<td class="'+(c.pinned?'pinnedCell':'')+'" style="width:'+(c.width||140)+'px;'+(c.pinned?'left:'+pinnedLeft(t,t.columns.indexOf(c))+'px;':'')+'">'+cell(r,c,i)+'</td>').join('')+'</tr>').join('');let totals=visible.filter(c=>c.type==='amount').map(c=>fmt(t.rows.reduce((s,r)=>s+(Number(r[c.id])||0),0))).join(' · ');appEl.innerHTML='<div class="top"><button class="btn" onclick="backHome()">←</button><h1>'+esc(t.name)+'</h1><input id="tableSearch" class="search" style="margin:0;max-width:280px" placeholder="Search table…" oninput="tableSearch(this.value)"></div><div class="tableWrap"><table class="grid"><thead><tr><th>#</th>'+headers+'</tr></thead><tbody>'+body+'</tbody></table></div><div class="total">Σ '+(totals||'')+'</div><div class="dock"><button class="btn" onclick="formEntry()"><span class="dockIcon">✎</span><span class="dockLabel">Form</span></button><button class="btn" onclick="manageColumns()"><span class="dockIcon">⚙</span><span class="dockLabel">Columns</span></button><button class="btn" onclick="filterSimple()"><span class="dockIcon">⌕</span><span class="dockLabel">Filter</span></button><button class="btn" onclick="moreTable()"><span class="dockIcon">⋮</span><span class="dockLabel">More</span></button></div>';bindHeader();}
function fmt(n){return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2})}
function cell(r,c,i){let v=r[c.id]??'';if(c.type==='status'||c.type==='select'){return '<button class="selectCell" onclick="selectCell(\''+c.id+'\','+i+',event)"><span class="status">'+esc(v||'Select…')+'</span></button>'}if(c.type==='checkbox')return '<input type="checkbox" '+(v?'checked':'')+' onchange="setVal('+i+',\''+c.id+'\',this.checked)">';if(c.type==='date')return '<input class="cellInput" type="date" value="'+esc(v)+'" onchange="setVal('+i+',\''+c.id+'\',this.value)">';if(c.type==='number'||c.type==='amount')return '<input class="cellInput" type="number" value="'+esc(v)+'" onchange="setVal('+i+',\''+c.id+'\',this.value)">';return '<input class="cellInput" value="'+esc(v)+'" onchange="setVal('+i+',\''+c.id+'\',this.value)">'}
function setVal(i,c,v){let wrap=document.querySelector('.tableWrap');let x=wrap?wrap.scrollLeft:0;table().rows[i][c]=v;save();renderTable();requestAnimationFrame(()=>{let w=document.querySelector('.tableWrap');if(w)w.scrollLeft=x})}
function tableSearch(q){document.querySelectorAll('tbody tr').forEach(tr=>tr.classList.remove('hit'));let found=null;for(const [i,r] of table().rows.entries()){if(JSON.stringify(r).toLowerCase().includes(q.toLowerCase())){found=i;break}}if(q&&found!==null){let tr=document.querySelector('tr[data-row="'+found+'"]');if(tr){tr.classList.add('hit');tr.scrollIntoView({block:'center'})}}}
function bindHeader(){document.querySelectorAll('th[data-col]').forEach(th=>{let tm;th.addEventListener('pointerdown',e=>{tm=setTimeout(()=>columnMenu(th.dataset.col),550)});['pointerup','pointercancel','pointermove'].forEach(ev=>th.addEventListener(ev,e=>{if(ev==='pointermove'&&(Math.abs(e.clientX)>0)){if(ev==='pointermove'&&tm){/* long press survives tiny moves */}}else{clearTimeout(tm);tm=null}}));th.addEventListener('contextmenu',e=>{e.preventDefault();columnMenu(th.dataset.col)})})}
function columnMenu(cid){let c=table().columns.find(x=>x.id===cid);modal('<h2>'+esc(c.name)+'</h2><button class="btn" onclick="renameCol(\''+cid+'\')">✎ Edit</button><button class="btn" onclick="filterCol(\''+cid+'\')">⌕ Filter</button><button class="btn" onclick="sortCol(\''+cid+'\',1)">↑ Sort ascending</button><button class="btn" onclick="sortCol(\''+cid+'\',-1)">↓ Sort descending</button><button class="btn" onclick="pinCol(\''+cid+'\')">'+(c.pinned?'Unpin':'📌 Pin')+'</button><button class="btn" onclick="groupCol(\''+cid+'\')">▤ Group</button>'+(c.type==='select'||c.type==='status'?'<hr><h3>Options</h3><div>'+ (c.options||[]).map((o,i)=>'<div class="option"><input value="'+esc(o)+'" onchange="optEdit(\''+cid+'\','+i+',this.value)"><button class="btn" onclick="optUp(\''+cid+'\','+i+')">↑</button><button class="btn" onclick="optDown(\''+cid+'\','+i+')">↓</button><button class="btn" onclick="optDel(\''+cid+'\','+i+')">×</button></div>').join('')+'<button class="btn primary" onclick="optAdd(\''+cid+'\')">＋ Add option</button></div>':'')+'<div class="row"><button class="btn" onclick="closeModal()">Done</button></div>')}
function renameCol(id){let c=table().columns.find(x=>x.id===id),n=prompt('Column name',c.name);if(n?.trim()){c.name=n.trim();save();closeModal();renderTable()}}function widthCol(id){let c=table().columns.find(x=>x.id===id),n=prompt('Width in px',c.width||140);c.width=Math.max(80,Math.min(500,Number(n)||140));save();closeModal();renderTable()}function sortCol(id,d){table().rows.sort((a,b)=>String(a[id]??'').localeCompare(String(b[id]??''),undefined,{numeric:true})*d);save();closeModal();renderTable()}function filterCol(id){let q=prompt('Contains value (blank clears)',table().filters?.[id]||'');table().filters=table().filters||{};if(q)table().filters[id]=q;else delete table().filters[id];save();closeModal();renderTable()}function pinCol(id){let c=table().columns.find(x=>x.id===id);c.pinned=!c.pinned;save();closeModal();renderTable()}
function groupCol(cid){let t=table();t.groupBy=t.groupBy===cid?null:cid;save();closeModal();renderTable();toast(t.groupBy?'Grouped by column':'Grouping cleared')}
function selectCell(cid,i,e){let c=table().columns.find(x=>x.id===cid);let opts=c.options||['Option 1','Option 2'];let m=document.createElement('div');m.className='menu';m.style.left=Math.min(e.clientX,innerWidth-240)+'px';m.style.top=Math.min(e.clientY,innerHeight-300)+'px';m.innerHTML=opts.map(o=>'<button onclick="pickOpt(\''+cid+'\','+i+',\''+esc(o).replace(/'/g,'\\\'')+'\')">'+esc(o)+'</button>').join('')+'<button onclick="manageOptions(\''+cid+'\')">⚙ Manage options</button>';document.body.appendChild(m);setTimeout(()=>document.addEventListener('pointerdown',function f(x){if(!m.contains(x.target)){m.remove();document.removeEventListener('pointerdown',f)}},{once:false}),0)}
function pickOpt(cid,i,v){table().rows[i][cid]=v;save();document.querySelectorAll('.menu').forEach(x=>x.remove());renderTable()}function manageOptions(cid){document.querySelectorAll('.menu').forEach(x=>x.remove());columnMenu(cid)}function optAdd(id){let c=table().columns.find(x=>x.id===id);(c.options||(c.options=[])).push('New option');save();columnMenu(id)}function optEdit(id,i,v){table().columns.find(x=>x.id===id).options[i]=v;save()}function optDel(id,i){table().columns.find(x=>x.id===id).options.splice(i,1);save();columnMenu(id)}function optUp(id,i){if(i<1)return;let a=table().columns.find(x=>x.id===id).options;[a[i-1],a[i]]=[a[i],a[i-1]];save();columnMenu(id)}function optDown(id,i){let a=table().columns.find(x=>x.id===id).options;if(i>=a.length-1)return;[a[i],a[i+1]]=[a[i+1],a[i]];save();columnMenu(id)}
function manageColumns(){let t=table();modal('<h2>Manage columns</h2>'+t.columns.map((c,i)=>'<div class="row"><input value="'+esc(c.name)+'" onchange="table().columns['+i+'].name=this.value;save()"><select onchange="table().columns['+i+'].type=this.value;save()">'+['text','number','amount','date','time','phone','select','status','checkbox'].map(x=>'<option value="'+x+'" '+(c.type===x?'selected':'')+'>'+x+'</option>').join('')+'</select><button class="btn" onclick="moveCol('+i+',-1)">↑</button><button class="btn" onclick="moveCol('+i+',1)">↓</button></div>').join('')+'<button class="btn primary" onclick="addCol()">＋ Add column</button><div class="row"><button class="btn" onclick="closeModal();renderTable()">Done</button></div>')}
function addCol(){table().columns.push({id:id(),name:'New column',type:'text',width:140});save();manageColumns()}function moveCol(i,d){let a=table().columns,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();manageColumns()}
function filterSimple(){let t=table();let cols=t.columns.map((c,i)=>(i+1)+'. '+c.name).join('\n');let n=Number(prompt('Filter which column?\n'+cols));if(!n||!t.columns[n-1])return;filterCol(t.columns[n-1].id)}
function rowMenu(i,e){modal('<h2>Row '+(i+1)+'</h2><button class="btn" onclick="insertRow('+i+')">＋ Insert row</button><button class="btn" onclick="duplicateRow('+i+')">Duplicate</button><button class="btn" onclick="clearRow('+i+')">Clear</button><button class="btn" onclick="deleteRow('+i+')">Delete</button><div class="row"><button class="btn" onclick="closeModal()">Close</button></div>')}function insertRow(i){table().rows.splice(i,0,{});save();closeModal();renderTable()}function duplicateRow(i){table().rows.splice(i+1,0,Object.assign({},table().rows[i]));save();closeModal();renderTable()}function clearRow(i){table().rows[i]={};save();closeModal();renderTable()}function deleteRow(i){if(!confirm('Delete this row?'))return;table().rows.splice(i,1);save();closeModal();renderTable()}
function tableListMenu(id,e){let t=state.tables.find(x=>x.id===id);if(!t)return;let p=document.createElement('div');p.className='menu';p.style.left=Math.min(e.clientX,innerWidth-245)+'px';p.style.top=Math.min(e.clientY,innerHeight-360)+'px';p.innerHTML='<button onclick="this.parentElement.remove();openTable(\''+id+'\');setTimeout(formEntry,40)">✎ Form entry</button><button onclick="this.parentElement.remove();openTable(\''+id+'\');setTimeout(renameTable,40)">✎ Rename</button><button onclick="this.parentElement.remove();duplicateTableById(\''+id+'\')">⧉ Duplicate / Copy</button><button onclick="this.parentElement.remove();deleteTableById(\''+id+'\')">🗑 Delete</button><button onclick="this.parentElement.remove();folderChange(\''+id+'\')">▣ Change folder</button><button onclick="this.parentElement.remove();addToHomeScreen()">⌂ Add to home screen</button>';document.body.appendChild(p);setTimeout(()=>document.addEventListener('pointerdown',function f(x){if(!p.contains(x.target)){p.remove();document.removeEventListener('pointerdown',f)}},{once:true}),0)}
function duplicateTableById(id){let t=state.tables.find(x=>x.id===id);if(!t)return;let c=JSON.parse(JSON.stringify(t));c.id=idFn();c.name=t.name+' Copy';state.tables.push(c);save();drawCards();toast('Table copied')}
function idFn(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function deleteTableById(id){let t=state.tables.find(x=>x.id===id);if(!t)return;if(confirm('Delete '+t.name+'?')){state.tables=state.tables.filter(x=>x.id!==id);save();home();toast('Table deleted')}}
function folderChange(id){let t=state.tables.find(x=>x.id===id);if(!t)return;let opts=state.folders.map(f=>'<option value="'+esc(f)+'" '+(f===t.folder?'selected':'')+'>'+esc(f)+'</option>').join('');modal('<div class="menuHeader"><h2>Change folder</h2><div class="muted">'+esc(t.name)+'</div></div><select id="folderPick">'+opts+'</select><div class="row"><button class="btn" onclick="newFolderFromDialog(\''+id+'\')">＋ New folder</button><button class="btn primary" onclick="saveFolderChange(\''+id+'\')">Save</button></div>')}
function newFolderFromDialog(id){let n=prompt('Folder name','New Folder');if(!n?.trim())return;if(!state.folders.includes(n.trim()))state.folders.push(n.trim());let t=state.tables.find(x=>x.id===id);if(t)t.folder=n.trim();save();closeModal();home()}
function saveFolderChange(id){let t=state.tables.find(x=>x.id===id),v=document.getElementById('folderPick')?.value;if(t&&v){t.folder=v;save()}closeModal();home()}
function formEntry(){let t=table();if(!t)return;let fields=t.columns.filter(c=>!c.hidden).map(c=>{let input;if(c.type==='select'||c.type==='status'){input='<select id="form_'+c.id+'"><option value="">Select…</option>'+((c.options||[]).map(o=>'<option>'+esc(o)+'</option>').join(''))+'</select>'}else if(c.type==='checkbox'){input='<input id="form_'+c.id+'" type="checkbox" style="flex:0">'}else{let typ=c.type==='date'?'date':c.type==='time'?'time':(c.type==='number'||c.type==='amount')?'number':c.type==='phone'?'tel':'text';input='<input id="form_'+c.id+'" type="'+typ+'">'}return '<div class="row"><label style="width:110px">'+esc(c.name)+'</label>'+input+'</div>'}).join('');modal('<div class="menuHeader"><h2>Form entry</h2><div class="muted">Add a new row to '+esc(t.name)+'</div></div>'+fields+'<div class="row"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveFormEntry()">Add entry</button></div>')}
function saveFormEntry(){let t=table(),r={};if(!t)return;t.columns.forEach(c=>{let e=document.getElementById('form_'+c.id);if(e)r[c.id]=c.type==='checkbox'?e.checked:e.value});t.rows.push(r);save();closeModal();renderTable();toast('Entry added')}
function addToHomeScreen(){if(window._deferredPrompt){window._deferredPrompt.prompt();window._deferredPrompt=null;return}toast('Use Chrome menu → Add to Home screen')}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window._deferredPrompt=e});
function moreTable(){modal('<div class="menuHeader"><h2>'+esc(table().name)+'</h2><div class="muted">Table options</div></div><button class="btn" onclick="renameTable()">✎ Rename table</button><button class="btn" onclick="backup()">💾 Backup</button><button class="btn danger" onclick="deleteTable()">🗑 Delete table</button><div class="row"><button class="btn" onclick="closeModal()">Close</button></div>')}function renameTable(){let n=prompt('Table name',table().name);if(n?.trim()){table().name=n.trim();save();closeModal();renderTable()}}function deleteTable(){if(confirm('Delete this table?')){state.tables=state.tables.filter(t=>t.id!==state.active);save();closeModal();home()}}function backup(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tableflow-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup saved');}
function menu(){modal('<div class="menuHeader"><h2>TableFlow</h2><div class="muted">App menu</div></div><p class="muted">Simple, flexible local tables.</p><button class="btn" onclick="closeModal();home()">All tables</button><button class="btn" onclick="newTable();closeModal()">＋ New table</button><button class="btn" onclick="backup()">💾 Backup all tables</button><button class="btn" onclick="restore()">♻ Restore backup</button><button class="btn" onclick="closeModal();location.reload()">↻ Refresh</button><div class="row"><button class="btn" onclick="closeModal()">Done</button></div>')}function restore(){closeModal();let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let f=i.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.tables))throw Error();state=x;state.active=null;save();home();toast('Restored')}catch(e){alert('Invalid backup')}};r.readAsText(f)};i.click()}
let resize={};function resizeStart(e,cid){e.preventDefault();let th=e.target.parentElement,start=e.clientX,w=th.getBoundingClientRect().width;resize={cid,start,w};document.addEventListener('pointermove',resizeMove);document.addEventListener('pointerup',resizeEnd,{once:true})}function resizeMove(e){if(!resize.cid)return;let c=table().columns.find(x=>x.id===resize.cid);c.width=Math.max(80,Math.min(500,resize.w+e.clientX-resize.start));renderTable()}function resizeEnd(){save();resize={}}
window.addEventListener('beforeunload',e=>{if(state.active){e.preventDefault();e.returnValue=''}});try{save();home()}catch(err){appEl.innerHTML='<div style="padding:24px"><h2>TableFlow could not start</h2><p style="color:#b00020">'+esc(err&&err.message||err)+'</p><button class="btn" onclick="localStorage.removeItem(KEY);location.reload()">Reset app data</button></div>';console.error(err)} if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=76').then(r=>r.update()).catch(()=>{}));
</script></body></html>
